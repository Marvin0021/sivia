<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descargando...</title>
</head>
<body>
    <script>
        // Descargar inmediatamente sin mostrar nada
        const link = document.createElement('a');
        link.href = 'SIVIA.apk';
        link.download = 'SIVIA.apk';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        
        // Cerrar la pestaña después de 1 segundo (opcional)
        setTimeout(function() {
            window.close();
        }, 1000);
    </script>
</body>
</html>
