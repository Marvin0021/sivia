<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIVIA - Descargado</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: white;
            opacity: 0;
            animation: fadeIn 0.5s ease-in forwards;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
            }
            to {
                opacity: 1;
            }
        }
        
        .container {
            text-align: center;
            background: #f9f9f9;
            padding: 60px 40px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
            max-width: 500px;
            animation: slideUp 0.6s ease-out;
            border: 1px solid #e0e0e0;
        }
        
        @keyframes slideUp {
            from {
                transform: translateY(30px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }
        
        h1 {
            color: #333;
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }
        
        .mensaje {
            color: #666;
            font-size: 16px;
            margin-bottom: 30px;
            line-height: 1.6;
        }
        
        .logo-container {
            margin-top: 30px;
            padding-top: 30px;
            border-top: 2px solid #eee;
        }
        
        .logo-container img {
            max-width: 200px;
            height: auto;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            animation: zoomIn 0.7s ease-out;
        }
        
        @keyframes zoomIn {
            from {
                transform: scale(0.8);
                opacity: 0;
            }
            to {
                transform: scale(1);
                opacity: 1;
            }
        }
        
        .checkmark {
            font-size: 50px;
            margin-bottom: 15px;
            animation: bounce 0.6s ease-out;
        }
        
        @keyframes bounce {
            0% {
                transform: scale(0);
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
            }
        }
    </style>
</head>
<body>
    <div class="container" id="mensaje-container" style="display: none;">
        <div class="checkmark">✅</div>
        <h1>¡Gracias por descargar SIVIA!</h1>
        <p class="mensaje">Tu descarga ha comenzado correctamente. Disfruta de nuestra aplicación.</p>
        <div class="logo-container">
            <img src="logo.png" alt="Logo">
        </div>
    </div>

    <script>
        // Descargar el APK inmediatamente
        function descargarAPK() {
            const link = document.createElement('a');
            link.href = 'SIVIA.apk';
            link.download = 'SIVIA.apk';
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            
            // Mostrar el mensaje y logo después de 500ms
            setTimeout(function() {
                document.getElementById('mensaje-container').style.display = 'block';
            }, 500);
        }

        // Iniciar descarga cuando la página carga
        window.addEventListener('load', descargarAPK);
    </script>
</body>
</html>
